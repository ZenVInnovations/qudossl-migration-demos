# QudoSSL NGINX Migration Demo — backend configuration.
#
# HTTP ONLY. TLS is terminated by NGINX in front of this application; the
# backend never speaks TLS. Do not enable server.ssl.* here — that would defeat
# the point of the demo (TLS terminates at the proxy, not the app).
server.port=8080
server.address=0.0.0.0

spring.application.name=qudossl-nginx-demo

# Expose only health and info via Actuator; nothing sensitive.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
