# BEFORE — baseline stack on STOCK OpenSSL (no QudoSSL, no post-quantum TLS).
#
#   docker compose up -d --build
#   curl -k https://localhost/
#
# NGINX (official image, linked against the distro's classical-only OpenSSL)
# terminates TLS and proxies plain HTTP to the Spring Boot app on :8080.
# This is the state a customer starts from. Bring it up, confirm it works,
# THEN migrate with docker-compose.qudossl.yml.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: qudossl-nginx-demo-app:1.0.0
    container_name: nginx-demo-app
    expose:
      - "8080"          # HTTP only, reachable to nginx on the internal network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-bookworm
    container_name: nginx-demo-proxy
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
