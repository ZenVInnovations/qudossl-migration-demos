# BEFORE — baseline NGINX TLS termination on STOCK OpenSSL.
#
# Classical TLS 1.2/1.3 only: the stock nginx image is linked against the
# distribution's OpenSSL, which has no ML-KEM groups. This is the "before"
# state a customer starts from. TLS terminates here; the backend is plain HTTP.

upstream backend {
    server app:8080;
}

server {
    listen              443 ssl;
    http2               on;
    server_name         localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    # Surface the negotiated key-exchange group so the migration is observable.
    add_header X-TLS-Protocol $ssl_protocol always;
    add_header X-TLS-Cipher   $ssl_cipher   always;
    add_header X-TLS-Group    $ssl_curve    always;

    location / {
        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
