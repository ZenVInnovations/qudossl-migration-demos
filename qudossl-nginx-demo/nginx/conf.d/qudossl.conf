# AFTER — QudoSSL-enabled NGINX TLS termination (post-quantum key exchange).
#
# This is the SAME server block as the baseline (default.conf) with exactly ONE
# functional line added: the ssl_conf_command Groups directive. Everything else
# — certificate, ciphers, backend, headers — is unchanged. That is the whole
# point: migrating to post-quantum TLS is one config line, on an nginx binary
# that is BUILT AGAINST QudoSSL (see nginx/Dockerfile.qudossl).
#
# ML-KEM key exchange is upstream OpenSSL 3.5's own; QudoSSL supplies the
# provider. Group names are case-sensitive and must match OpenSSL 3.5.7 exactly.

upstream backend {
    server app:8080;
}

server {
    listen              443 ssl;
    http2               on;
    server_name         localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;   # unchanged — stays classical RSA
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;               # ML-KEM requires TLS 1.3
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    # QudoSSL migration configuration ---------------------------------------
    # THE post-quantum line: ML-KEM hybrids first, classical curves last as a
    # fallback that keeps existing (classical-only) clients working.
    ssl_conf_command Groups X25519MLKEM768:SecP256r1MLKEM768:SecP384r1MLKEM1024:secp256r1:secp384r1;
    # -----------------------------------------------------------------------

    # NOTE: nginx's $ssl_curve prints the IANA CODEPOINT for an ML-KEM hybrid,
    # e.g. X-TLS-Group: 0x11ec  (= X25519MLKEM768), not the name. A classical
    # client shows the curve name (prime256v1). To see the group NAME, use
    # scripts/verify-tls.sh (qudossl s_client) — it is the authoritative check.
    add_header X-TLS-Protocol $ssl_protocol always;
    add_header X-TLS-Cipher   $ssl_cipher   always;
    add_header X-TLS-Group    $ssl_curve    always;

    location / {
        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
