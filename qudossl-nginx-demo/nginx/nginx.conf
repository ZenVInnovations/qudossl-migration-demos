# QudoSSL NGINX Migration Demo — top-level nginx configuration.
# Identical for the baseline (stock OpenSSL) and the QudoSSL image; the only
# thing that differs between BEFORE and AFTER is conf.d/default.conf (see the
# two variants in this directory). Keeping this file constant makes the
# migration diff small and reviewable.

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format tls '$remote_addr - [$time_local] "$request" $status '
                   'proto=$ssl_protocol cipher=$ssl_cipher group=$ssl_curve';
    access_log /var/log/nginx/access.log tls;

    sendfile on;
    keepalive_timeout 65;

    # The active server block. Docker mounts either the baseline or the QudoSSL
    # variant of default.conf here.
    include /etc/nginx/conf.d/*.conf;
}
