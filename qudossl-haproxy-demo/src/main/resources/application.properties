# QudoSSL HAProxy Migration Demo — backend runs plain HTTP on 8080.
#
# HTTP ONLY. Do NOT enable server.ssl.* here: TLS is terminated by HAProxy in
# front of this app. Enabling TLS here would defeat the whole demo.
server.port=8080
server.address=0.0.0.0

spring.application.name=qudossl-haproxy-demo

# Expose only health and info via the actuator.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
