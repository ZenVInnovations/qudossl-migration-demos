# AFTER — QudoSSL-enabled HAProxy TLS termination (post-quantum key exchange).
#
# This is the SAME config as the baseline (haproxy.cfg) with exactly ONE
# functional line added: the global ssl-default-bind-curves directive. The
# certificate, backend, timeouts, and headers are unchanged. HAProxy itself is
# BUILT AGAINST QudoSSL (see haproxy/Dockerfile.qudossl); the directive tells it
# to offer the ML-KEM hybrid groups on every TLS bind.
#
# ML-KEM key exchange is upstream OpenSSL 3.5's own; QudoSSL supplies the
# provider. Group names are case-sensitive and must match OpenSSL 3.5.7 exactly.

global
    log stdout format raw local0 info
    maxconn 2048

    # QudoSSL migration configuration ---------------------------------------
    # THE post-quantum line: ML-KEM hybrids first, classical curves last as a
    # fallback that keeps existing (classical-only) clients working.
    ssl-default-bind-curves X25519MLKEM768:SecP256r1MLKEM768:SecP384r1MLKEM1024:secp256r1:secp384r1
    # -----------------------------------------------------------------------

defaults
    mode    http
    log     global
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend https_in
    bind :443 ssl crt /etc/haproxy/certs/server.pem
    # Surface the negotiated TLS parameters back to the CLIENT for observability.
    # NOTE: use http-RESPONSE (client-facing). http-request headers go to the
    # backend, not the client. %[ssl_fc_curve] is HAProxy's key-exchange group
    # fetch (it reports the client's negotiated group). The authoritative group
    # NAME check is still scripts/verify-qudossl.sh (qudossl s_client), which
    # prints "Negotiated TLS1.3 group: X25519MLKEM768".
    http-response set-header X-TLS-Protocol %[ssl_fc_protocol]
    http-response set-header X-TLS-Cipher   %[ssl_fc_cipher]
    http-response set-header X-TLS-Group    %[ssl_fc_curve]
    default_backend app_backend

backend app_backend
    server app app:8080 check init-addr last,libc,none
