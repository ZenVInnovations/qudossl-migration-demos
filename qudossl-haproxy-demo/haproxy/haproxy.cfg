# BEFORE — baseline HAProxy TLS termination on STOCK OpenSSL.
#
# Classical TLS 1.2/1.3 only: the stock haproxy image is linked against the
# distribution's OpenSSL, which has no ML-KEM groups. TLS terminates here at the
# frontend; the backend is plain HTTP to the Spring Boot app on :8080.

global
    log stdout format raw local0 info
    maxconn 2048

defaults
    mode    http
    log     global
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend https_in
    bind :443 ssl crt /etc/haproxy/certs/server.pem
    # Surface the negotiated TLS parameters back to the CLIENT for observability.
    # NOTE: use http-RESPONSE (client-facing). http-request headers go to the
    # backend, not the client. HAProxy has no sample fetch for the negotiated
    # key-exchange GROUP, so the group is verified with scripts/verify-tls.sh
    # (an in-container QudoSSL s_client), not a header.
    http-response set-header X-TLS-Protocol %[ssl_fc_protocol]
    http-response set-header X-TLS-Cipher   %[ssl_fc_cipher]
    default_backend app_backend

backend app_backend
    server app app:8080 check init-addr last,libc,none
